name: Elite System CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-systems-code:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up GCC Compiler
      run: sudo apt-get update && sudo apt-get install -y gcc

    - name: Compile Systems Code
      run: |
        gcc -Wall -O3 my_malloc.c -o my_malloc_test
        gcc -Wall micro_shell.c -o micro_shell_test
        gcc -Wall -O3 io_bench.c -o io_bench_test
        gcc -Wall -O3 vm.c -o elite_vm_test
        echo "All Elite C modules compiled successfully."
