name: EAKV Sovereign Cloud 24/7 Engine

on:
  schedule:
    # Runs every 6 hours automatically in the cloud
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-sovereign-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Execute Sovereign Master Suite & Telemetry Loop
        run: |
          python3 master_execution_suite.py
          python3 aggressive_demographic_shift.py
          python3 self_learning_optimizer.py

      - name: Commit & Sync Telemetry State
        run: |
          git config --global user.name "EAKV Cloud Sovereign Bot"
          git config --global user.email "bot@eakv. sovereign"
          git add reel_performance.csv cron_execution.log active_target.json || true
          git commit -m "auto: 24/7 cloud sovereign execution sweep [skip ci]" || true
          git push origin main
